name:  Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * *

jobs:
  build_windows:
    name: Windows Build
    if: github.repository == 'odin-lang/Odin'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: build Odin
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
          ./build.bat 1 1
      - name: Odin run
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
          odin run examples/demo
      - name: Copy artifacts
        run: |
          rm bin/llvm/windows/LLVM-C.lib
          mkdir dist
          cp odin.exe dist
          cp LICENSE dist
          cp LLVM-C.dll dist
          cp -r shared dist
          cp -r base dist
          cp -r core dist
          cp -r vendor dist
          cp -r bin dist
          cp -r examples dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: windows_artifacts
          path: dist
  build_linux:
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      DOCKER_IMAGE: ${{ matrix.arch == 'amd64' && 'alpine:3.24' || 'arm64v8/alpine:3.24' }}
    name: Linux Build ${{ matrix.arch }}
    if: github.repository == 'odin-lang/Odin'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: (Linux) Download LLVM and Build Odin
        run: |
          docker run --rm -v "$PWD:/src" -w /src $DOCKER_IMAGE sh -c '
            apk add --no-cache \
              musl-dev llvm20-dev clang20 lld bash build-base git mold lz4 \
              libxml2-static llvm20-static zlib-static zstd-static \
              make &&
            git config --global --add safe.directory /src &&
            ./ci/build_linux_static.sh &&
            # Provision the Linux-hosted PE/COFF linker into the bundle so the
            # cross link path (and the vendor-demo compile check below)
            # works. lld-link is a multi-call alias of the lld driver; the lld
            # package ships it as a symlink to /usr/bin/lld, so copy the resolved
            # binary to the bundled path the compiler looks for
            # ($ODIN_ROOT/bin/windows-cross/lld-link). lld is multi-call: invoked
            # as "lld-link" (by file name) it dispatches the PE/COFF driver, so
            # copying either the lld-link alias or the lld driver to that name
            # works. It is a Linux-host binary (not a *.exe/*.dll/*.lib), so
            # ci/remove_windows_binaries.sh keeps it and it ships in the Linux
            # distribution exactly as the bundle README intends.
            cp -L "$(command -v lld-link || command -v lld)" ./bin/windows-cross/lld-link &&
            chmod +x ./bin/windows-cross/lld-link &&
            # Pre-generate the windows_amd64 import libs (kernel32.lib,
            # ucrtbase.lib, bcrypt.lib, ntdll.lib, plus the vendor-demo set
            # user32/gdi32/shell32/winmm/opengl32.lib) from the vendored .def
            # files using the in-container llvm-dlltool, so the Linux distribution
            # ships ready-made .lib files and the user machine needs no
            # dlltool/MSVC SDK. bcrypt (BCryptGenRandom) and ntdll (RtlGetVersion)
            # are required for a flag-free default core:sys/windows cross link;
            # user32/gdi32/shell32/winmm are pulled by vendor:raylib/vendor:glfw
            # windowing/GDI/shell/timing (opengl32 bundled for future GL demos).
            # The script is list-driven, so this one invocation produces all of
            # them. amd64 only: these are windows_amd64 import libs regardless of
            # the host arch.
            DLLTOOL=llvm-dlltool ./bin/windows-cross/lib/generate-import-libs.sh &&
            # Build the windows_amd64 compiler-rt builtins archive
            # (libclang_rt.builtins-x86_64.a) from the upstream compiler-rt
            # source with the in-container clang, so the cross link can resolve
            # LLVM runtime builtins (__chkstk, __udivti3, __multi3, ...) with no
            # MSVC CRT. Pinned to the same LLVM major as everything else.
            apk add --no-cache curl xz &&
            CLANG=clang LLVM_AR=llvm-ar ./bin/windows-cross/lib/generate-compiler-rt.sh &&
            # Positive cross compile/link check:
            # cross-build every vendor demo (cgltf, sdl3, glfw, raylib, box2d)
            # for windows_amd64 from this Linux host against the just-generated
            # import libs + compiler-rt, and structurally validate each .exe
            # (PE32+, console, expected imported DLLs, no static MSVC CRT) with
            # the in-container llvm-readobj. Runs ALONGSIDE the existing
            # native-link regression / check_all windows-cross guardrails, not
            # replacing them. bin/windows-cross/lld-link is found automatically
            # by the compiler from $ODIN_ROOT.
            ODIN=./odin LLVM_READOBJ=llvm-readobj bash tests/cross/vendor/check-vendor-demos.sh
          '
      - name: Odin run
        run: ./odin run examples/demo
      - name: Copy artifacts
        run: |
          FILE="odin-linux-$ARCH-nightly+$(date -I)"
          mkdir $FILE
          cp odin $FILE
          cp LICENSE $FILE
          cp -r shared $FILE
          cp -r base $FILE
          cp -r core $FILE
          cp -r vendor $FILE
          cp -r examples $FILE
          # Bundle bin/ so the Linux-hosted cross linker (bin/windows-cross/lld-link)
          # ships in the distribution; Windows-only binaries are stripped below.
          cp -r bin $FILE
          ./ci/remove_windows_binaries.sh $FILE
          # Creating a tarball so executable permissions are retained, see https://github.com/actions/upload-artifact/issues/38
          tar -czvf dist.tar.gz $FILE
      - name: Odin run
        run: |
          FILE="odin-linux-$ARCH-nightly+$(date -I)"
          $FILE/odin run examples/demo
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'amd64' && 'linux_artifacts' || 'linux_arm_artifacts' }}
          path: dist.tar.gz
  build_macos:
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    name: Macos Build ${{ matrix.arch }}
    if: github.repository == 'odin-lang/Odin'
    runs-on: ${{ matrix.arch == 'amd64' && 'macos-15-intel' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download LLVM and setup PATH
        run: |
          brew update
          brew install llvm@20 dylibbundler lld@20
          brew link llvm@20

      - name: build odin
        # These -L makes the linker prioritize system libraries over LLVM libraries, this is mainly to
        # not link with libunwind bundled with LLVM but link with libunwind on the system.
        run: CXXFLAGS="-L/usr/lib/system -L/usr/lib" make nightly
      - name: Bundle
        run: |
          FILE="odin-macos-$ARCH-nightly+$(date -I)"
          mkdir $FILE
          cp odin $FILE
          cp LICENSE $FILE
          cp -r shared $FILE
          cp -r base $FILE
          cp -r core $FILE
          cp -r vendor $FILE
          cp -r examples $FILE
          ./ci/remove_windows_binaries.sh $FILE
          dylibbundler -b -x $FILE/odin -d $FILE/libs -od -p @executable_path/libs
          # Creating a tarball so executable permissions are retained, see https://github.com/actions/upload-artifact/issues/38
          tar -czvf dist.tar.gz $FILE
      - name: Odin run
        run: |
          FILE="odin-macos-$ARCH-nightly+$(date -I)"
          $FILE/odin run examples/demo
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'amd64' && 'macos_artifacts' || 'macos_arm_artifacts' }}
          path: dist.tar.gz
  upload_b2:
    runs-on: [ubuntu-latest]
    needs: [build_windows, build_macos, build_linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.x'

      - name: Install B2 SDK
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade b2sdk

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Download Windows artifacts

        uses: actions/download-artifact@v4.1.7
        with:
          name: windows_artifacts
          path: windows_artifacts

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux_artifacts
          path: linux_artifacts

      - name: Download Ubuntu ARM artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux_arm_artifacts
          path: linux_arm_artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: macos_artifacts
          path: macos_artifacts

      - name: Download macOS arm artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          name: macos_arm_artifacts
          path: macos_arm_artifacts

      - name: Debug
        run: |
          tree -L 2

      - name: Create archives and upload
        shell: bash
        env:
          APPID: ${{ secrets.B2_APPID }}
          APPKEY: ${{ secrets.B2_APPKEY }}
          BUCKET: ${{ secrets.B2_BUCKET }}
          DAYS_TO_KEEP: ${{ secrets.B2_DAYS_TO_KEEP }}
        run: |
          file linux_artifacts/dist.tar.gz
          python3 ci/nightly.py artifact windows-amd64 windows_artifacts/
          python3 ci/nightly.py artifact linux-amd64 linux_artifacts/dist.tar.gz
          python3 ci/nightly.py artifact linux-arm64 linux_arm_artifacts/dist.tar.gz
          python3 ci/nightly.py artifact macos-amd64 macos_artifacts/dist.tar.gz
          python3 ci/nightly.py artifact macos-arm64 macos_arm_artifacts/dist.tar.gz
          python3 ci/nightly.py prune
          python3 ci/nightly.py json
